prefix: '<gradient:#37d7ff:#a477ff><bold>ZeroStudio</bold></gradient> <dark_gray>»</dark_gray> '
no-permission: '<prefix><red>You do not have permission to do that.</red>'
players-only: '<prefix><red>This command can only be used in-game.</red>'
player-not-found: '<prefix><red>That player is not online.</red>'
request:
  sent: '<prefix><gray>Teleport request sent to <white><target></white>.</gray>'
  received: '<prefix><aqua><sender></aqua> <gray>sent you a teleport request.</gray>'
  received-here: '<prefix><aqua><sender></aqua> <gray>wants you to teleport to them.</gray>'
  accepted: '<prefix><green><receiver> accepted your request.</green>'
  accepted-by-you: '<prefix><green>You accepted <sender>''s request.</green>'
  denied: '<prefix><red><receiver> denied your request.</red>'
  denied-by-you: '<prefix><gray>You denied <sender>''s request.</gray>'
  expired: '<prefix><gray>Your request to <target> expired.</gray>'
  expired-receiver: '<prefix><gray>The request from <sender> expired.</gray>'
  cancelled: '<prefix><gray>Your outgoing request(s) were cancelled.</gray>'
  cancel-none: '<prefix><red>You have no outgoing requests.</red>'
  duplicate: '<prefix><red>You already have an active request to that player.</red>'
  self: '<prefix><red>You cannot send a request to yourself.</red>'
  disabled: '<prefix><red>That player is not accepting requests.</red>'
  disabled-world: '<prefix><red>Teleport requests are disabled in this world.</red>'
  cooldown: '<prefix><red>Please wait <seconds> seconds before sending another request.</red>'
  limit: '<prefix><red>You have reached your outstanding request limit.</red>'
  none: '<prefix><red>You have no incoming request from that player.</red>'
  none-incoming: '<prefix><red>You have no incoming requests.</red>'
  multiple: '<prefix><yellow>You have requests from: <players>. Use /tpaccept <player> or /tpdeny <player>.</yellow>'
  busy: '<prefix><red>That player is already teleporting.</red>'
  countdown: '<prefix><yellow>Your teleport countdown has started.</yellow>'
  teleporting-title: '<aqua><bold>TELEPORTING</bold></aqua>'
  teleporting-subtitle: '<gray>Teleporting in <white><seconds></white> seconds...</gray>'
  teleport-success: '<prefix><green>Teleport complete.</green>'
  teleport-cancelled: '<prefix><red>Teleport cancelled: <reason></red>'
  destination-invalid: '<prefix><red>The destination is no longer available or safe.</red>'
  toggle-on: '<prefix><green>Incoming requests are enabled.</green>'
  toggle-off: '<prefix><yellow>Incoming requests are disabled.</yellow>'
  auto-on: '<prefix><green>Automatic request acceptance is enabled.</green>'
  auto-off: '<prefix><yellow>Automatic request acceptance is disabled.</yellow>'
  reload: '<prefix><green>Configuration reloaded.</green>'
  help:
    - '<gradient:#37d7ff:#a477ff><bold>ZeroStudio TPA</bold></gradient>'
    - '<gray>/tpa <player> <dark_gray>—</dark_gray> Request to teleport to a player</gray>'
    - '<gray>/tpahere <player> <dark_gray>—</dark_gray> Ask a player to come to you</gray>'
    - '<gray>/tpaccept [player] <dark_gray>—</dark_gray> Accept a request</gray>'
    - '<gray>/tpdeny [player] <dark_gray>—</dark_gray> Deny a request</gray>'
    - '<gray>/tpcancel, /tpatoggle, /tpauto</gray>'